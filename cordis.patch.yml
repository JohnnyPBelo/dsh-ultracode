# dsh-ultracode bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published package. When the
# plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add <git-or-npm-spec>
#
# — and the package is listed in `dsh.profile.bundles`, the profile boot merges
# THIS patch.
#
# Two host rows mount the same package. The row names carry a SUBPATH on
# purpose: the client-module scanner treats a bare `@scope/name` specifier as
# naming that package, and it fails composition when one package resolves from
# two active Loader rows. A specifier with a subpath (`dsh-ultracode/delegate`)
# yields no package identity, so both halves mount cleanly while the `dsh.client`
# half is discovered from the single bare `.` row. Do not collapse these into
# two rows declaring the bare package name.
#
# Routes: this layer configures NO model catalog on purpose. Without one every
# UltraCode role runs on the session's own provider and model — `maximum` at
# that model's highest reasoning effort, `frugal` with the coder at its lowest
# and the validator at its highest — so the plugin never depends on a provider
# the installation lacks. To rank several models, override the row in the
# profile's own cordis.patch.yml. A profile entry REPLACES this row's whole
# config, so restate every key you want to keep:
#
#   - id: ultracode
#     config:
#       mode: maximum
#       keyword: ultracode
#       reminderEveryTurns: 10
#       catalog:
#         routes:                      # best first; frugal codes on the last
#           - { provider: <provider>, model: <strong-model>, effort: max }
#           - { provider: <provider>, model: <cheap-model>, effort: low }
#
# A route whose provider is not registered or has no usable credential falls
# back to the session's route, and the delegation result says so. The guidance
# text has a built-in default; set `section` only to replace it.
- insert:
    - id: ultracode
      name: 'dsh-ultracode'
      config:
        mode: maximum
        keyword: ultracode
        reminderEveryTurns: 10

    - id: tool-ultracode-delegate
      name: 'dsh-ultracode/delegate'
      config:
        provider: spawn
        maxValidationRounds: 3
